name: Release

# Publishes a GitHub release when main carries a package.json version that has no tag yet.
# The release notes are that version's section of CHANGELOG.md ("## vX.Y.Z ..." up to the next "## ").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.exists.outputs.released == 'false'
        run: |
          awk -v tag="${{ steps.version.outputs.tag }}" '
            index($0, "## " tag) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create tag and release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Nightingale ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
