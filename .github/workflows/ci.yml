name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Database schema and seed
        run: |
          npx prisma db push --skip-generate
          npx prisma db seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Offline evaluation smoke (grader self-test, no API key)
        run: npm run eval:smoke

      - name: Offline risk triage evaluation (floor invariants, oracle check, no API key)
        run: npm run eval:risk:smoke

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-reports
          path: |
            evals/results/smoke/report.md
            evals/results/risk-smoke/report.md
          if-no-files-found: ignore
